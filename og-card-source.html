<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap">
<style>
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;overflow:hidden;font-family:"Plus Jakarta Sans",sans-serif;color:#fff;position:relative;background:#0b3a28}
.bg{position:absolute;inset:0 0 0 360px;background:url(assets/course-hero.jpg) center 30%/cover no-repeat}
.fade{position:absolute;inset:0;background:
  linear-gradient(90deg,#0b3a28 0%,#0b3a28 31%,rgba(11,58,40,.93) 42%,rgba(11,58,40,.55) 58%,rgba(11,58,40,.05) 78%),
  linear-gradient(0deg,rgba(7,40,27,.75) 0%,rgba(7,40,27,0) 32%)}
.glow{position:absolute;left:-120px;top:-160px;width:620px;height:620px;border-radius:50%;background:radial-gradient(circle,rgba(232,121,47,.28),transparent 65%)}
.top{position:absolute;left:52px;top:42px;display:flex;align-items:center;gap:14px}
.logo{background:#fff;border-radius:14px;padding:8px 14px;display:flex}
.logo img{height:44px;display:block}
.pill{background:#e8792f;color:#fff;font-weight:800;font-size:16px;letter-spacing:.06em;text-transform:uppercase;padding:10px 16px;border-radius:999px;box-shadow:0 8px 20px rgba(232,121,47,.4)}
.pill.ghost{background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.35);box-shadow:none}
.txt{position:absolute;left:52px;top:135px;width:640px}
h1{font-weight:800;letter-spacing:-.03em;line-height:1}
h1 .a{display:block;font-size:46px}
h1 .b{display:block;font-size:74px;color:#ffb27a;margin-top:6px;text-shadow:0 6px 30px rgba(232,121,47,.35)}
.sub{font-size:28px;font-weight:700;color:rgba(255,255,255,.88);margin-top:10px}
.chips{position:absolute;left:52px;top:452px;display:flex;gap:10px}
.chip{display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.28);border-radius:14px;padding:10px 14px;font-weight:700;font-size:18px;backdrop-filter:blur(4px)}
.chip svg{width:22px;height:22px;color:#ffb27a;flex:none}
.foot{position:absolute;left:52px;bottom:40px;display:flex;align-items:center;gap:12px;font-size:19px;font-weight:600;color:rgba(255,255,255,.85)}
.foot b{color:#fff;font-size:24px;font-weight:800}
.foot i{width:6px;height:6px;border-radius:50%;background:#e8792f}
.trainer{position:absolute;right:40px;bottom:36px;background:#fff;color:#14211b;border-radius:18px;padding:12px 22px 12px 12px;display:flex;gap:14px;align-items:center;box-shadow:0 16px 36px rgba(0,0,0,.4)}
.trainer img{width:66px;height:66px;border-radius:50%;object-fit:cover;object-position:top;border:3px solid #e8792f}
.trainer small{display:block;font-size:12px;font-weight:800;letter-spacing:.12em;color:#c95f17;text-transform:uppercase}
.trainer b{display:block;font-size:23px;line-height:1.2}
.trainer span{display:block;font-size:14px;color:#58665f;font-weight:600}
</style></head><body>
<div class="bg"></div><div class="fade"></div><div class="glow"></div>
<div class="top">
  <div class="logo"><img src="assets/dac-logo.png"></div>
  <div class="pill">1-Day Workshop</div>
  <div class="pill ghost">Hands-On</div>
</div>
<div class="txt">
  <h1><span class="a">AI Productivity for</span><span class="b">Social Media<br>Content</span></h1>
  <div class="sub">A week of content in an afternoon</div>
</div>
<div class="chips">
  <div class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h16M4 11h16M4 16h10"/></svg>Captions</div>
  <div class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></svg>AI Visuals</div>
  <div class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><rect x="6" y="2.5" width="12" height="19" rx="3"/><path d="m10.5 9.5 4 2.5-4 2.5z"/></svg>Reels &amp; TikTok</div>
</div>
<div class="foot"><b>6,000+</b> professionals trained <i></i> <b>HRD Corp</b> claimable</div>
<div class="trainer"><img src="assets/david-hooi.jpg"><div><small>Your Trainer</small><b>David Hooi</b><span>HRD Corp Accredited Trainer</span></div></div>
</body></html>
